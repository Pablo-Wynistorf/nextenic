name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-deploy the current main without an empty commit.
  workflow_dispatch:

# GITHUB_TOKEN permissions needed by actions/deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. In-progress runs are allowed to finish so a
# half-uploaded artifact is never published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Runs before the build, and its side effect matters more than its output:
      # it sets the repository's Pages build type to "workflow", which is what
      # stops GitHub's legacy branch build from publishing as well.
      #
      # While the repository was still branch-based, a push started this workflow
      # AND the legacy pages-build-deployment together. Both emit an artifact
      # named github-pages; the legacy one finished last and published the raw
      # repository root, so the deployed index.html still pointed at
      # /src/main.jsx and the browser refused it as "text/jsx".
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build
        run: npm run build

      - name: Verify the build output before uploading
        # Cheap guard against publishing a tree that only looks right. If the
        # artifact ever contains the dev entry point again, fail here rather than
        # shipping a site that cannot boot.
        run: |
          test -f dist/index.html || { echo "dist/index.html missing"; exit 1; }
          test -f dist/404.html   || { echo "dist/404.html missing"; exit 1; }
          if grep -q "/src/main.jsx" dist/index.html; then
            echo "dist/index.html references the dev entry point; refusing to deploy."
            exit 1
          fi
          grep -q "assets/" dist/index.html || { echo "no hashed assets referenced"; exit 1; }
          echo "CNAME to be published: $(cat dist/CNAME 2>/dev/null || echo none)"
          ls -la dist

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
