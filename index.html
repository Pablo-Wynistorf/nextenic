<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>Nextenic GmbH — software for the mail you send and the parcels you ship</title>
    <meta
      name="description"
      content="Nextenic GmbH is a software company in Bern, Switzerland. We build and run two products: MailRift, email hosting on your own domain, and Swiss Shipping Labels, Swiss Post labels inside Shopify."
    />
    <!-- Canonical host. Both nextenic domains resolve here today (nextenic.ch
         redirects to www.nextenic.com), so the canonical, the alternates and
         the sitemap all point at .com to avoid a canonical/redirect mismatch. -->
    <link rel="canonical" href="https://www.nextenic.com/" />

    <!-- Let crawlers index the page and show large image/text previews. -->
    <meta
      name="robots"
      content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1"
    />

    <!-- Language alternates. The site is one SPA served in four languages,
         pinned with ?lang=; x-default is the English home. Keep these in step
         with public/sitemap.xml. -->
    <link rel="alternate" hreflang="en" href="https://www.nextenic.com/" />
    <link rel="alternate" hreflang="de-CH" href="https://www.nextenic.com/?lang=de" />
    <link rel="alternate" hreflang="fr-CH" href="https://www.nextenic.com/?lang=fr" />
    <link rel="alternate" hreflang="it-CH" href="https://www.nextenic.com/?lang=it" />
    <link rel="alternate" hreflang="x-default" href="https://www.nextenic.com/" />

    <meta name="theme-color" content="#08090b" />

    <!-- Icons. favicon.ico carries hand-tuned 16/32/48 bitmaps for browsers that
         still prefer it; favicon.svg is what modern browsers pick and is the one
         to edit. Vite rewrites these paths against the configured base. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Nextenic GmbH" />
    <meta property="og:url" content="https://www.nextenic.com/" />
    <meta property="og:title" content="Nextenic GmbH — software products from Bern" />
    <meta
      property="og:description"
      content="Two products, built and operated in Bern: MailRift for email hosting on your own domain, and Swiss Shipping Labels for Swiss Post labels inside Shopify."
    />
    <meta property="og:image" content="https://www.nextenic.com/apple-touch-icon.png" />
    <meta property="og:image:alt" content="Nextenic GmbH" />
    <meta property="og:locale" content="en" />
    <meta property="og:locale:alternate" content="de_CH" />
    <meta property="og:locale:alternate" content="fr_CH" />
    <meta property="og:locale:alternate" content="it_CH" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Nextenic GmbH — software products from Bern" />
    <meta
      name="twitter:description"
      content="Two products, built and operated in Bern: MailRift for email hosting on your own domain, and Swiss Shipping Labels for Swiss Post labels inside Shopify."
    />
    <meta name="twitter:image" content="https://www.nextenic.com/apple-touch-icon.png" />

    <!-- Colour mode, applied before first paint.
         Must match resolveTheme() in src/lib/theme.jsx: dark is the base theme and
         `.light` is the opt-in class. Doing this in React instead would show a
         dark flash to every light-mode visitor. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("nextenic:theme");
          var light =
            stored === "light" ||
            (stored !== "dark" &&
              window.matchMedia("(prefers-color-scheme: light)").matches);
          if (light) {
            document.documentElement.classList.add("light");
            document.documentElement.style.colorScheme = "light";
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute("content", "#fbfaf8");
          }
        } catch (e) {
          /* Storage unavailable — dark base theme applies. */
        }
      })();
    </script>

    <!-- Typeface pairing, see README for the reasoning:
         Bricolage Grotesque for display, Inter Tight for text,
         JetBrains Mono for the small technical labels. Only the weights
         actually used are requested. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..700&family=Inter+Tight:wght@400;500&family=JetBrains+Mono:wght@400&display=swap"
    />
